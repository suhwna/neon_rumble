services:
  neon-rumble:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neon-rumble
    restart: unless-stopped
    ports:
      - "4173:4173"
    environment:
      PORT: "4173"
      NEON_DB_PATH: /app/data/neon-rumble.sqlite
      NEON_SECRET: ${NEON_SECRET:-neon-rumble-local-docker-secret}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4173/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
